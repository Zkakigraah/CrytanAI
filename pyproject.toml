[project]
name = "cryptan-ai-project"
version = "0.2.0"
description = "AI-powered cryptanalysis of classical ciphers: 15 ciphers, real frequency-analysis/hill-climbing solvers, and a trained ML detector -- with a Streamlit UI on top."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "sympy>=1.12",          # Matrix math for Hill cipher encrypt/decrypt/crib-attack
    "scikit-learn>=1.8.0",  # RandomForestClassifier for cipher-type detection
    "joblib>=1.3.0",        # Persists the trained classifier to models/cipher_detector.joblib
    "streamlit>=1.30.0",    # app/ui.py
    "pandas>=2.0.0",        # frequency-analysis charts in the Analyze tab
    "python-docx>=1.0.0",   # .docx file upload
    "pypdf>=4.0.0",         # .pdf file upload
]

[project.optional-dependencies]
# Only needed to REGENERATE the bundled language-model statistics
# (scripts/build_language_model.py) or retrain the classifier on fresh
# data (ml/dataset_generator.py). Not needed to use the app -- both ship
# their computed output (ml/corpus/*.json, models/cipher_detector.joblib)
# directly, so a normal install never touches this.
dev = [
    "nltk>=3.8",
    "pytest>=7.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app", "ciphers", "ml", "solvers", "utils"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
